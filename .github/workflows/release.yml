name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Opens or updates the release PR (version bump in package.json, CHANGELOG.md).
      # When that PR is merged, tags the version and creates the GitHub Release.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The plugin manifest is generated by our script, not by release-please.
      # release-please rewrites its branch on every update, so this runs each time.
      - if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - if: ${{ steps.release.outputs.pr }}
        name: Sync plugin manifest
        run: |
          node scripts/build-plugin.mjs
          if git diff --quiet -- .claude-plugin; then
            echo "Plugin manifest already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin
          git commit -m "chore: sync plugin manifest"
          git push
