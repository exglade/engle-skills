name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# The work runs with the release App's token, not GITHUB_TOKEN, so the release PR
# and its pushes trigger the Check workflow without manual approval.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Opens or updates the release PR (version bump in package.json, CHANGELOG.md).
      # When that PR is merged, tags the version and creates the GitHub Release.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The plugin manifest is generated by our script, not by release-please.
      # Look up the open release PR each run: release-please's `pr` output is empty
      # when it leaves the PR unchanged, and it may rewrite the branch when it changes it.
      - id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json headRefName --jq '.[0].headRefName // empty')
          echo "Release PR branch: ${branch:-none}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.pr.outputs.branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ steps.app.outputs.token }}

      # Installs the pnpm version from package.json's packageManager, plus Node.
      - if: ${{ steps.pr.outputs.branch }}
        uses: pnpm/setup@v3
        with:
          runtime: node@26

      - if: ${{ steps.pr.outputs.branch }}
        name: Sync plugin manifest
        run: |
          pnpm build:plugin
          if git diff --quiet -- .claude-plugin; then
            echo "Plugin manifest already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin
          git commit -m "chore: sync plugin manifest"
          git push
