name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from package.json's packageManager, plus Node.
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
      # Fails when .claude-plugin/ is out of date; fix with `pnpm build:plugin`.
      - run: pnpm check:plugin
