name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Fails when .claude-plugin/ is out of date; fix with `pnpm build:plugin`.
      - run: node scripts/build-plugin.mjs --check
